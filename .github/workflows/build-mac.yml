# Build + sign + notarize the DASH Mac app from the PRIVATE dash-app source and
# publish it into THIS repo's release — for when dash-app's own Actions can't
# run (private-repo minutes are billed; public repos build free).
#
# The source is checked out with DASH_APP_TOKEN and is never committed or
# uploaded here; only the finished installers land on the Release. Steps mirror
# dash-app/.github/workflows/build-installers.yml's mac job — see the reasons
# there (dual-arch node-pty, our own signing keychain).
#
# Run: Actions > Build mac from dash-app > Run workflow > tag (e.g. v1.1.5).
# Secrets: DASH_APP_TOKEN, MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
name: Build mac from dash-app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'dash-app tag to build (e.g. v1.1.5) — its release must already exist here'
        required: true

permissions:
  contents: write # publish into this repo's release with GITHUB_TOKEN

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pbroas127/dash-app
          ref: ${{ inputs.tag }}
          token: ${{ secrets.DASH_APP_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add Intel (x64) node-pty binary for the dual-arch mac build
        run: |
          V=$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/@lydell/node-pty/package.json','utf8')).version)")
          npm i --no-save --force "@lydell/node-pty-darwin-x64@$V"
      - run: npx tsc -b && npx vite build
      - name: Import Developer ID certificate
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dash-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$MAC_CSC_LINK" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          rm -f "$P12"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "--- identities in the signing keychain ---"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - run: npx electron-builder --mac dmg zip --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
